<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Algorithm Advisor</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
  
  <!-- CodeMirror for Code Editor -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/theme/material-darker.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/theme/dracula.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/theme/monokai.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/clike/clike.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/go/go.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/rust/rust.min.js"></script>

  <!-- Mermaid for Flowcharts -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>

  <!-- c-slang for C execution sandbox -->
  <script src="https://cdn.jsdelivr.net/npm/c-slang@2.0.0/dist/c-slang.min.js"></script>

  <style>
    /* === Modern Theme & High Contrast === */

    /* Main background and text */
    body {
      background-color: #f8fafc; /* slate-50 */
      color: #0f172a; /* slate-900 */
    }

    .dark body {
      background-color: #020617; /* slate-950 */
      color: #e2e8f0; /* slate-200 */
      background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.04) 1px, transparent 0);
      background-size: 25px 25px;
    }

    /* Headings */
    h1, h2, h3, h4, h5 {
      color: #0f172a; /* slate-900 */
      font-weight: 700;
    }

    .dark h1, .dark h2, .dark h3, .dark h4, .dark h5 {
      color: #f8fafc; /* slate-50 */
    }

    /* Supporting text */
    p, span, label {
      color: #334155; /* slate-700 */
    }

    .dark p, .dark span, .dark label {
      color: #94a3b8; /* slate-400 */
    }

    /* Input / textarea visibility */
    textarea, input, select {
      background-color: #ffffff;
      color: #0f172a; /* slate-900 */
      border: 1px solid #cbd5e1; /* slate-300 */
    }

    textarea::placeholder {
      color: #64748b; /* slate-500 */
    }

    .dark textarea, .dark input, .dark select {
      background-color: #0f172a; /* slate-900 */
      color: #f1f5f9; /* slate-100 */
      border: 1px solid #334155; /* slate-700 */
    }

    .dark textarea::placeholder {
      color: #64748b; /* slate-500 */
    }

    /* CodeMirror editor */
    .CodeMirror {
      height: 400px;
      font-family: 'Fira Code', monospace;
      font-size: 14px;
      background-color: #f8fafc; /* slate-50 */
      color: #1e293b; /* slate-800 */
    }

    .dark .CodeMirror {
      background-color: #020617; /* slate-950 */
      color: #cbd5e1; /* slate-300 */
    }

    .CodeMirror-gutters {
      background-color: #e2e8f0; /* slate-200 */
      border-right: 1px solid #cbd5e1; /* slate-300 */
    }

    .dark .CodeMirror-gutters {
      background-color: #0f172a; /* slate-900 */
      border-right: 1px solid #334155; /* slate-700 */
    }

    /* Smooth transitions */
    body, .CodeMirror, h1, h2, h3, p, textarea {
      transition: background-color 0.3s, color 0.3s;
    }
  </style>
</head>

<body class="h-full font-sans bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-200 transition-colors duration-300">
  <div id="root" class="h-full"></div>

  <script type="importmap">
  {
    "imports": {
      "react/": "https://aistudiocdn.com/react@^19.2.0/",
      "react": "https://aistudiocdn.com/react@^19.2.0",
      "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
      "react-dom/client": "https://aistudiocdn.com/react-dom@^19.2.0/client",
      "@google/genai": "https://aistudiocdn.com/@google/genai@^1.28.0",
      "@jest/globals": "https://aistudiocdn.com/@jest/globals@^30.2.0"
    }
  }
  </script>

  <script type="module" src="/index.tsx"></script>
</body>
</html>
